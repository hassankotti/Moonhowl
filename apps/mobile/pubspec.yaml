name: moonhowl
description: "Moonhowl: a local Wi-Fi social deduction game."
publish_to: 'none'
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  howl_core: ^0.1.0
  howl_net: ^0.1.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  nsd: ^5.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
